# Mid-day learning pass: refresh stats & update the strategy model so tomorrow's
# plan reflects the latest performance. Uses ~5 API units. Also acts as a health check.
name: AutoTube analytics

on:
  schedule:
    - cron: "43 1 * * *"         # 01:43 UTC nightly
  workflow_dispatch:

concurrency:
  group: autotube
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m autotube analytics
        if: ${{ env.YT_REFRESH_TOKEN != '' }}
      - name: Commit state
        run: |
          git config user.name "autotube-bot"
          git config user.email "autotube-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "analytics: $(date -u +%F)"
          git pull --rebase -q && git push -q || echo "push skipped"
