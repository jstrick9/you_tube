# ─────────────────────────────────────────────────────────────────────────────
#  AutoTube — channel configuration
#  Everything the system does is driven from this file. Secrets (API keys,
#  OAuth tokens) are NEVER stored here — they come from environment variables
#  (GitHub Actions secrets). See README.md → "Setup".
# ─────────────────────────────────────────────────────────────────────────────

channel:
  name: "Archive 13"                      # shown on-screen (brand tag) and in the description footer
  handle: "@archive13"                       # YouTube handle, used in the description call-to-action
  niche: >-
    A numbered archive of real things that should not be possible — unsolved
    disappearances, declassified records, deep-ocean and deep-space discoveries and
    the parts of history nobody managed to explain. Two running series, CASE and
    FIELD, every episode sourced and cited, narrated with dry disbelief.
  language: en
  region: US                             # trend region (Google Trends geo / YouTube chart)
  timezone: America/New_York
  # Topic categories the system can choose from. The analytics loop learns
  # which of these perform best and shifts output toward them automatically.
  # Trimmed to exactly the two lanes. A category the lanes never serve is an arm the
  # bandit must still spend videos measuring, for a topic that is then off-theme.
  categories: [history, mysteries, culture, science, space, nature, animals, geography]
# ── Channel identity ── Archive 13's creative direction; branding and recurring voice do not guarantee monetization.
persona:
  # "Every file is real" carries the same load the old "it's proven" did - it is the
  # stated reason the speculation ban in safety.py exists. What changed is the second
  # half: the channel now promises unresolved, not debunked.
  catchphrase: "Every file is real. That's the problem."
  character: >-
    a dry-witted, slightly incredulous narrator who finds real facts more ridiculous than fiction. Talks to ONE
    viewer like a friend ("okay, this one is unhinged"), reacts with short deadpan asides, is never mean to real
    people or groups, and never exaggerates the facts themselves — the facts are wild enough.
  asides: true                     # 1-2 short humorous reactions per script (fact-checked as jokes, never as facts)
  max_asides: 2
  proof_stamp: true                # end card: "PROVEN ✓" rubber stamp + the source, with a stamp sound
  stamp_seconds: 2.0
  # Creative identity choice: keep one primary narrator. This is not a platform requirement or performance guarantee.
  voice: en-US-AndrewNeural        # null = learned by the bandit (not recommended below ~500 videos)

schedule:
  # Internal operations setting; no platform-level cadence threshold or recommendation effect is assumed.
  # A range and deterministic jitter keep automated top-up runs consistent while varying scheduled slots.
  videos_per_day: [1, 3]
  jitter_minutes: 40                     # deterministic +/- offset applied to each slot
  publish_times: ["12:00", "17:30", "20:30"]   # local time slots (channel.timezone)
  notify_subscribers: false              # local notification-volume preference; no recommendation effect is assumed
  max_run_minutes: 120                   # stop producing after this (GitHub job timeout is 150)
  # How much of that budget to hold back. The deadline is only testable between topics,
  # and one topic costs 20-40 minutes of drafting, vision and rendering, so starting a
  # topic at minute 119 means finishing somewhere past the 150-minute job cap - killed
  # mid-render, losing the work and the artifact. Runs have been measured at 49, 73,
  # 112, 142, 217 and 220 minutes; the long ones are this.
  topic_reserve_minutes: 30

video:
  kind: short                            # 1080x1920 vertical YouTube Short
  # Internal length experiment: 15-20s keeps scripts focused, but this is not an official YouTube
  # distribution rule and no universal winning length or "dead zone" has been established for this channel.
  # Evaluate against mature averageViewPercentage and engaged-view analytics; change this with the
  # script-structure rules and tests/test_length.py together. See docs/MONETIZATION.md.
  target_seconds: [15, 20]
  fps: 30
  width: 1080
  height: 1920
  voices:                                # rotated/learned by the bandit (edge-tts neural voices)
    - en-US-AndrewNeural
    - en-US-AvaNeural
    - en-US-BrianNeural
    - en-US-EmmaNeural
    - en-US-ChristopherNeural
  speech_rate: "+8%"
  animate_stills: true                   # photos get a 2.5D depth-parallax camera move (autotube/motion.py)
  sound_effects: true                    # procedural whoosh/ding/riser/hit/stamp (autotube/sfx.py), copyright-free
  sfx_volume_db: -12
  kinetic_captions: true                 # keyword colour pop, number count-ups, reveal flash, italic asides
  background_music: true                 # procedurally generated, copyright-free ambient bed
  music_volume_db: -26
  loudness_lufs: -14

content:
  # Script formats — rotated and learned as an editorial variety experiment. A recurring format is fine;
  # the factual substance and value-add still need to be original. Format variation alone is no policy safe harbor.
  # Entertainment-first formats (each is a genuinely different kind of video). The topic selector says which
  # formats each topic can honestly support; analytics compares averageViewPercentage and engaged-view outcomes.
  formats: [sounds_fake, ranked_escalation, guess_reveal, plot_twist, myth_buster, would_you_survive,
            dumbest_decision, scale_shock, backstory, what_if, creepy_true]
  # Formats only used in certain months (1-12). In season, one video per run uses it whenever a topic fits.
  seasonal_formats:
    creepy_true: [10]              # October: "creepy but true" (eerie, never gory)
  hook_styles: [question, bold_claim, number_first, you_statement, disbelief]
  # Across one early sample, comments were rare relative to likes. These devices offer a genuine prompt
  # for viewer participation; no claim is made that comments are a fixed or dominant ranking signal.
  # Keep the question relevant to the story, not engagement bait.
  # ── Local originality checks ──
  # YouTube may treat repetitive or mass-produced content as inauthentic, but it does not publish a
  # fixed script-similarity percentage or video-count trigger. AutoTube uses this configurable lexical
  # similarity check as a conservative internal warning/block, not as a representation of policy.
  # Format may repeat; the substance and value-add must not. Set to 1.0 to disable this local check.
  max_script_similarity: 0.25
  similarity_window: 25       # how many recent episodes a new draft is compared against
  audit_window: 25            # how many recent episodes the channel-level audit looks at
  # A count, not a percentage: a ratio floor makes the requirement depend on how wordy
  # the rest of the script is, and a script landing exactly on a float threshold gets
  # rejected by rounding. One aside is the whole ask - deliberately not a quota, because
  # a rejected draft burns a retry and can lose the topic entirely. The ratio is still
  # measured and stored per video as telemetry. 0 disables.
  min_asides: 1

  # ── Recurring series ──
  # CASE and FIELD are Archive 13 editorial series; numbering is a creative convention, not a subscriber-growth claim.
  # Episode numbers are derived from history rather than a stored counter to avoid accidental reuse or gaps.
  series:
    unsolved:
      tag: "CASE"
      categories: [history, mysteries, culture]
      remit: "a real unsolved or barely-explained event from the human record"
    field:
      tag: "FIELD"
      categories: [science, space, nature, animals, geography]
      remit: "a real thing in the natural world that should not be possible"

  comment_devices: [none, poll, hot_take, unanswered_question, challenge, correction_bait]
  require_grounding: true                # every claim must be supported by fetched source text
  # Grounding requirement scales with script length (see scriptwriter.grounding_floor). A flat count
  # was written for 5-6 segment scripts; at 15-20s they are 4-5 segments, where a flat 3 would have
  # quietly become 3-of-4. 5- and 6-segment scripts are unaffected.
  min_grounded_segments: 3                # cap
  min_grounded_ratio: 0.5
  min_grounded_floor: 2
  # Living people are allowed, but only as PUBLIC FIGURES discussed in their professional
  # capacity — see safety.person below and autotube/safety.check_person. Fails closed.
  allow_living_people: true             # skip topics that are biographies of living people
  dedupe_days: 45                        # don't repeat a topic within N days
  min_trend_score: 0.35
  # ── virality ──
  min_viral_score: 7                     # LLM viral-potential score (0-10) a topic needs, judged with its trend evidence
  min_hook_score: 7                      # reviewer's hook_strength (0-10) a script needs; weaker hooks are rewritten
                                         # Was 8, set when the "reviewer" was the writer grading itself. An
                                         # independent reviewer scores a full point lower: measured 7/10 x12,
                                         # 6/10 x7, 5/10 x1 over one run, so 8 rejected every script ever written.
  min_coherence: 6
                                         # Raised 4 -> 6 on measured scores, not guesswork. The first run
                                         # carrying this criterion scored three published scripts 5, 6 and 8;
                                         # the 5 was "Some fish spend three quarters of life on land / they
                                         # crawl / they breathe through skin / they leap 61cm", which is a
                                         # list with no chain. 6 rejects that and leaves the other two.
  min_trend_alignment: 8                 # independent reviewer must confirm the specific trend angle is actually delivered
  min_entertainment: 6                   # reviewer's (harsh) entertainment score; flat fact-lists are rewritten
                                         # Was 7. Same recalibration: independent scores ran 5/10 x24, 6/10 x19,
                                         # 4/10 x9, 3/10 x2. 6 keeps a real floor (3-5/10 still rejected) and
                                         # restores roughly the pass rate the gates were tuned for.
  hook_words_min: 6                      # deterministic gate (autotube/gates.py) — not left to the LLM
  hook_words_max: 12
  body_beat_words: [9, 11]               # enforce the prompted turn/escalation length per segment
  payoff_words: [6, 9]                   # a short factual payoff, not a dangling fragment
  max_drafts: 4                          # script rewrites allowed (feedback from the fact-checker/hook gate)
  selection_rounds: 3                    # if every pick fails the checks, pick again from the remaining trends
  # Reviewer judges whether the payoff loops back into the hook (semantic, not lexical).
  # Recorded on every script; off as a hard gate until its false-positive rate is known.
  require_loop: false
  loop_ending: true                      # stylistic goal: last line flows back to the first; no view-count effect is assumed
  reveal_pause: 0.55                     # beat of silence before the reveal line (riser SFX + flash fill it)
  countdown_pause: 1.25                  # guess_reveal format: on-screen 3-2-1 before the answer

trends:
  # YouTube outliers are direct evidence of recent topic demand; additional feeds broaden discovery.
  # Every production candidate must also pass the live-evidence filter in autotube/trends.py and
  # the viral-potential review in autotube/scriptwriter.py. Source availability is not guaranteed.
  # Editorial scope is intentionally limited to the two approved lanes below; this is a channel choice,
  # not a claim about recommendation or monetization outcomes.
  lanes:
    history_mystery:
      queries: ["unsolved mystery", "history facts", "disappeared without a trace", "declassified", "did you know history"]
      categories: [history, mysteries, culture]
      # Distinct lane profiles guide editorial treatment. They are creative constraints, not a representation
      # of YouTube's monetization review criteria; the underlying facts and story remain topic-specific.
      profile:
        tone: >-
          cool, documentary, a little conspiratorial. You are reading from a file nobody
          was meant to see. Understate the strangest detail rather than selling it.
        hook_style: >-
          open on the unresolved fact itself - the detail that should not be true. Never
          open with a question or with scene-setting.
        pacing: >-
          slower, with one deliberate pause before the payoff. Let the final line land
          without a wrap-up.
    science_nature:
      queries: ["science facts", "space facts", "animal facts", "ocean facts", "deep sea discovery"]
      categories: [science, space, nature, animals, geography]
      profile:
        tone: >-
          bright, fast, delighted. You have just found this out and cannot wait to say
          it. Awe rather than mystery.
        hook_style: >-
          open on the most absurd number or comparison, stated flatly. Scale is the hook.
        pacing: >-
          brisk, front-loaded, each line topping the last. End on the biggest fact, not
          a reflection.
  # Each search.list costs 100 quota units, so 14 queries is ~1,400 of the 10,000/day ceiling.
  max_queries_per_run: 14
  youtube_outlier_queries: []            # legacy flat list; the lanes above supersede it
  format_pulse: true                     # learn which hook shapes are winning on YouTube right now
  # 72h, not 96. "Trending" has a shelf life: a video that broke out four days ago is
  # already being covered by everyone who saw it break out. Not tightened further
  # because candidate supply is the binding constraint - abandonment already runs high
  # and starving the queue would just mean fewer videos, not fresher ones.
  outlier_window_hours: 72
  outlier_min_views: 30000
  wikipedia_spike_check: 40              # top-N Wikipedia pages compared with their own 30-day normal
  min_wikipedia_spike: 3.0               # Wikipedia is corroboration only, and only at >=3x its own 30-day baseline
  min_google_trend_traffic: 1000          # measured RSS traffic needed for Google Trends to qualify alone
  min_independent_trend_families: 2       # weak live signals must agree across distinct platforms, not repeated feeds
  min_hackernews_points: 10                # minimum current front-page response before HN can corroborate
  trend_evidence_max_age_hours: 36        # source capture timestamp must be recent; YouTube outliers also recheck video age
  # Off: an anniversary is a calendar entry, not a trend. Nothing is happening right
  # now because something happened on this date in 1847, and every channel with a
  # scheduler has the same list. Trend sources must be things actually moving today.
  on_this_day: false

compliance:
  made_for_kids: false
  # Set true only if a video contains *realistic* altered/synthetic content
  # (e.g. AI-generated realistic scenes). Our pipeline uses real licensed
  # photos + narration, so the default is false. See README → Compliance.
  contains_synthetic_media: false
  ai_disclosure_in_description: true     # transparent "AI-assisted narration" line
  allowed_licenses: [cc0, pdm, "public domain", "cc by", "cc-by", "cc by-sa", "cc-by-sa", pexels]
  # Words allowed as a passing, non-graphic historical mention in narration (e.g. "during the Thirty Years' War")
  # even though they stay blocked as a video's TOPIC — YouTube's advertiser-friendly guidelines allow educational,
  # non-graphic references. The title may still never contain them.
  script_mention_ok: [war]
  # Topic safety is context-aware — see autotube/safety.py and the `safety:` block below.
  # The old flat 57-word blocklist rejected `war`, `crash`, `leak`, `trial`, `cure`, `odds`, `flood`,
  # `earthquake` and more, which deleted huge amounts of safe, high-performing territory (volcanoes,
  # deep-sea, aviation engineering, archaeology, the history of medicine). YouTube's advertiser-
  # friendly guidelines are about context and graphicness, not vocabulary.
  blocked_topics: []                    # legacy key, kept empty for backward compatibility
  require_independent_review: false     # true = also refuse to publish if the reviewer had to be the writer's model
  quality_gate_min_score: 7              # LLM reviewer score (0-10) required to publish

safety:
  # Tiered screening (autotube/safety.py). Only tier 3 ever costs an LLM call, and it is the rare case.
  #   hard_blocked  → rejected instantly, never reviewed
  #   sensitive     → kept as a candidate, then judged IN CONTEXT once we have the real article:
  #                   "an engineering crash test" and "a fatal crash" are not the same video
  #   title_blocked → never allowed in a title, however educational the video is
  # If the classifier is unreachable, a sensitive subject is rejected — the same behaviour as the old
  # keyword list, so this is never less safe than what it replaces.
  context_review: true
  hard_blocked:
    - rape
    - incest
    - child abuse
    - porn
    - pornography
    - onlyfans
    - nude
    - gore
    - beheading
    - mutilation
    - torture
    - suicide
    - self-harm
    - overdose
    - serial killer
    - massacre
    - genocide
    - terror attack
    - mass shooting
    - school shooting
    - xxx
    - brothel
  title_blocked:
    - murder
    - killer
    - massacre
    - execution
    - suicide
    - rape
    - porn
    - nude
    - gore
    - corpse
    - tragedy
    - victims
  # Words that only mean "judge this in context" (the full list lives in autotube/safety.py;
  # anything listed here replaces it).
  sensitive: null
  person:
    require_public_figure: true          # a private individual who merely went viral is never a topic
    allow_minors: false
    blocked_angles: null                 # null → autotube/safety.PERSON_BLOCKED_ANGLES

research:
  # Grounding corpora beyond Wikipedia (autotube/sources.py). Wikipedia still resolves and anchors
  # every topic; these widen what we can VERIFY against, which is what lifts the virality ceiling
  # without loosening a single fact-check. All keyless, all free, all quotable prose, all fail-soft.
  #   nasa     — NASA Image & Video Library (public domain, descriptive captions)
  #   arxiv    — paper abstracts (physics, astronomy, CS, biology)
  #   pubmed   — Europe PMC abstracts (medicine, life sciences)
  #   wikidata — quantitative facts (height, mass, population, inception) rendered as sentences;
  #              exactly what scale_shock and by_the_numbers need, and often absent from article prose
  extra_sources: [wikidata, nasa, arxiv, pubmed]
  enrich_below_chars: 7000      # only enrich when the Wikipedia article is thinner than this
  enrich_max_chars: 4000
  news_fallback: true                    # trends with no Wikipedia article: ground in the news record
  min_outlets: 2                         # independent publishers required before a story may be used        # cap on added text, so the writer prompt stays focused

llm:
  # Providers are tried in order; any provider without a key is skipped.
  # All have free tiers. Pollinations needs no key at all (last-resort fallback).
  providers: [groq, gemini, cerebras, mistral, cloudflare, nvidia, pollinations]
  # Groq writes first, deliberately. Gemini is the ONLY vision-capable provider here
  # (Groq serves no vision model and there is no OpenRouter key), and image verification
  # is a hard gate - if it cannot run, the video is correctly thrown away. Letting Gemini
  # also do every script burned its free-tier quota on text and then 429'd the vision
  # call, losing the whole run. Text has three providers to fall back on; vision has one,
  # so the scarce capability gets the quota.
  gemini_models: [gemini-flash-lite-latest, gemini-flash-latest, gemini-3.1-flash-lite, gemini-3-flash-preview]
  # Live run 2026-10-03 (workflow_dispatch 37109430187) showed ALL THREE previous Groq
  # models failing: both gpt-oss models are reasoning models and reject Groq's
  # json_object mode with HTTP 400 "Failed to validate JSON", and qwen/qwen3.8-27b
  # returned 429 on every call. Groq therefore contributed nothing and every review
  # silently fell back to Gemini - the same model that wrote the script, so the run
  # produced zero independent reviews.
  groq_models: [openai/gpt-oss-120b, openai/gpt-oss-20b, qwen/qwen3.8-27b]
  # Added 3 Oct 2026 to end a day of total rate-limit lockout on gemini+groq. All three
  # are permanent free tiers that need no credit card. Model ids below are a best guess
  # and MUST be confirmed with `python -m autotube doctor`, which checks them against
  # each provider's live catalogue - guessed ids have cost this repo three runs already.
  cerebras_models: [llama-3.3-70b, gpt-oss-120b, qwen-3-32b]
  cerebras_review_models: [gpt-oss-120b, llama-3.3-70b]
  mistral_models: [mistral-small-latest, ministral-8b-latest]
  mistral_review_models: [mistral-small-latest]
  cloudflare_models: ["@cf/meta/llama-3.3-70b-instruct-fp8-fast", "@cf/deepseek-ai/deepseek-v4-flash-0731"]
  cloudflare_review_models: ["@cf/meta/llama-3.3-70b-instruct-fp8-fast"]
  # Vision is the hard gate - if no vision model answers, the video is discarded - and
  # until now Gemini was the only provider that could serve it. That single point of
  # failure ended two of the last three full runs with a 429 after the script had
  # already been written and verified. Cloudflare's free tier carries vision models, so
  # one key removes the dependency. Ids are a guess; `doctor` checks them.
  # Ordered by what the live probe actually did, not by what the catalogue lists.
  # llama-4-scout is genuinely multimodal and ungated. llava-1.5 authenticates but
  # returns empty content for a JSON instruction - it is too weak to follow the format
  # the vision gate needs. llama-3.2-vision 403s on a token that serves Cloudflare text
  # fine, so it is per-model access needing a licence accepted in the dashboard.
  cloudflare_vision_models: ["@cf/meta/llama-4-scout-17b-16e-instruct"]
  # NVIDIA NIM: free tier, no card, 130+ models including vision. Ids are a guess that
  # `doctor` will confirm or replace - four providers have now shipped a wrong model id.
  nvidia_models: [google/gemma-4-31b-it, google/gemma-3-12b-it]
  nvidia_review_models: [google/gemma-4-31b-it]
  nvidia_vision_models: [meta/llama-3.2-90b-vision-instruct]
  pollinations_models: [openai-fast, openai]
  # Fact-checking/review runs on a DIFFERENT model from the one that wrote the draft (a writer grading
  # its own homework agrees with itself). Deliberately the reverse order of `providers`, so when both
  # Gemini and Groq are keyed the writer and the reviewer are different families. If none is reachable
  # the review falls back to the normal order and the run is flagged as non-independent.
  review_providers: [cerebras, groq, mistral, nvidia, gemini, cloudflare]
  groq_review_models: [openai/gpt-oss-120b, qwen/qwen3.8-27b, openai/gpt-oss-20b]
  gemini_review_models: [gemini-flash-latest, gemini-flash-lite-latest]
  # image-checking models (keyless Pollinations can't see images, so it's never used for this)
  # Fast model first. Vision is called once per segment per attempted video, and on the
  # 90B model each call was taking 3-5 minutes - runs reached 217 minutes and started
  # overlapping the schedule. Cloudflare's scout is 17B and proven working against a
  # real image; the 90B stays as the fallback for when scout is rate limited. Quality
  # difference matters less than it looks because both models were score-inflating
  # anyway, which the calibration in vision.py addresses directly.
  vision_providers: [cloudflare, nvidia, gemini]
  gemini_vision_models: [gemini-flash-lite-latest, gemini-flash-latest]   # gemini-2.5-* now return 404
  groq_vision_models: []
  temperature: 0.8

media:
  # photos: pexels (only with PEXELS_API_KEY), wikimedia, openverse
  # moving footage: commons_video (Wikimedia Commons videos), nasa_video (NASA library, public domain, keyless),
  #                 pexels_video (only with PEXELS_API_KEY — portrait stock clips)
  # Pixazo-generated visuals are off by default for factual Archive 13 footage; media.gather also suppresses
  # the provider whenever compliance.contains_synthetic_media is false, even if it is accidentally listed here.
  sources: [commons_video, nasa_video, archive_video, pexels_video, pexels, wikimedia, openverse]
  prefer_video: true                     # a verified clip beats an equally good still (motion holds attention)
  video_bonus: 1.0
  # Ranking nudge toward assets that fill a 9:16 frame without upscaling (see media.shape_bonus).
  # A bonus rather than a filter: hard-filtering to portrait starves the pool and the vision judge
  # starts approving weak matches. 0 disables it.
  shape_bonus: 1.0                       # ranking bonus for clips among APPROVED candidates (never lowers the bar)
  max_video_mb: 90                       # skip (or use a smaller version of) bigger source files
  min_image_width: 900
  # Every image is LOOKED AT before use (see autotube/vision.py): CLIP pre-ranks candidates, then a
  # vision LLM (Gemini free tier) scores a contact sheet against the exact narration line.
  require_llm_verdict: true              # ONLY a vision model may approve an image; if none is reachable the
                                         # video is not made (nothing unverified is ever published)
  min_match_score: 7                     # 0-10; every line needs its own image scoring at least this
  requery: true                          # a line with no match gets a second search with new queries
  min_distinct_images: 3                 # fewer distinct verified images → pick another topic
  multi_shot_seconds: 3.5                # lines longer than this get 2 different verified shots
  vision_sheet_size: 9                   # candidates per vision-LLM call (3x3 contact sheet)
  clip: true
  clip_model: ViT-B-32
  clip_pretrained: laion2b_s34b_b79k

qa:
  # Final gate on the FINISHED video, right before upload (autotube/qa.py): every shot is checked against
  # the narration, intended-shot request, selected asset description and provenance; positive matches get a
  # blind adversarial second look. Speech is also checked against the script. Fail → use a verified spare or
  # re-search using the frame-specific failure, then re-check; never relax the gate or publish a rejected render.
  min_frame_score: 7
  repair_min_match_score: 8                  # stronger pre-render match required for a QA-triggered replacement
  max_repairs: 2
  frames_per_sheet: 8

upload:
  enabled: true                           # false = render only (dry run)
  category_id: "27"                       # 27 = Education
  default_privacy: public                 # applied via scheduled publishAt
  playlist_per_category: false

analytics:
  enabled: true
  evaluate_after_hours: 48                # judge a video's performance after N hours
  exploration: 0.15                       # extra random exploration on top of Thompson sampling
  cold_start_min: 3        # sample any arm with fewer than this many observations before trusting posteriors
  # How many of the most recent uploads get their stats re-fetched each pass. This is the real
  # limit on what the channel can learn from: YouTube's API terms require stored statistics to be
  # re-verified every 30 days, so any video outside this window has its metrics dropped and leaves
  # the reward pool. Raising it costs one stats call per 50 videos. history_keep must stay >= this,
  # or videos would be forgotten before they are ever measured.
  refresh_videos: 300
  history_keep: 2000                      # entries kept in state/history.json (also the topic-repeat memory)

  # Reward weights and targets are internal optimization settings, not claims about YouTube's ranking formula.
  # AverageViewPercentage is the watch-quality input; audienceWatchRatio remains curve-shape telemetry only.
  w_retention: 0.50
  w_reach: 0.20
  w_subs: 0.20
  w_engagement: 0.10
  target_subs_per_1k: 2.0                 # internal net-subscriber target per 1,000 engaged views when available
  w_breakout: 0.15                        # internal preference for unusually strong engaged-view velocity
  breakout_multiple: 5.0                  # multiple of target_engaged_vph used by the internal reward
  target_avg_view_pct: 70.0               # internal average-view target, measured with averageViewPercentage
  average_view_gate_pct: 70.0             # reporting threshold only; not a YouTube distribution gate
  target_engaged_vph: 40.0                # internal engaged Shorts views/hour target
  target_engagement: 0.06                 # internal (likes + 3*comments) / raw public views target
  rank_min_videos: 40                     # below this many mature videos, score against absolute targets
  rank_min_spread: 0.35                   # otherwise blend with within-channel percentile rank
  min_views_to_learn: 50                  # minimum engaged views for a video to contribute evidence

  # ── what the bandit spends its evidence on ──
  # Frozen dimensions rotate for variety but are not learned. With thousands of possible cells and a few
  # videos a day, spreading evidence across every dimension means none of them ever separates; freezing
  # voice and hook_style makes category and format converge several times faster. Unfreeze once the
  # channel is doing real volume.
  frozen_dimensions: [voice, hook_style, source]
  min_observations: 8                     # a dimension is sampled at random until it has this much evidence

notify:
  # Optional free push notifications via ntfy.sh (no account) or a Discord webhook.
  # Set NTFY_TOPIC or DISCORD_WEBHOOK_URL as secrets to enable.
  on_success: true
  on_failure: true
